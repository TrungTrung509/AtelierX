<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">ATEL-12/v1 — swatch sáng và tối</title>
  <desc id="desc">Bảng màu số đề xuất cho vải hoodie đen và vùng in tương phản, đặt trên nền sáng và tối.</desc>
  <rect width="960" height="480" fill="#f4f4f2"/>
  <text x="32" y="42" font-family="sans-serif" font-size="24" font-weight="700" fill="#17191d">ATEL-12/v1 · Swatch vật liệu số</text>
  <text x="32" y="72" font-family="sans-serif" font-size="14" fill="#50545a">Bảng màu định hướng — không phải ảnh render trên model / bằng chứng QA.</text>
