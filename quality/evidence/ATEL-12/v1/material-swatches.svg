    <rect x="54" y="154" width="178" height="88" rx="8" fill="#17191D"/><text x="54" y="266" font-size="14" fill="#303238">Fleece đen · #17191D</text>
    <rect x="250" y="154" width="178" height="88" rx="8" fill="#E7E0D2"/><text x="250" y="266" font-size="14" fill="#303238">Mực ngà · #E7E0D2</text>
    <rect x="54" y="294" width="178" height="72" rx="8" fill="#AAA69D"/><text x="54" y="390" font-size="14" fill="#303238">Trung gian · #AAA69D</text>
    <rect x="250" y="294" width="178" height="72" rx="8" fill="#34363A"/><text x="250" y="390" font-size="14" fill="#303238">Bóng than · #34363A</text>
    <rect x="496" y="100" width="432" height="330" rx="14" fill="#24262a"/>
    <text x="518" y="132" font-size="18" font-weight="700" fill="#f3f1eb">Nền tối</text>
