    <rect x="714" y="154" width="178" height="88" rx="8" fill="#E7E0D2"/><text x="714" y="266" font-size="14" fill="#f3f1eb">Mực ngà · #E7E0D2</text>
    <rect x="518" y="294" width="178" height="72" rx="8" fill="#AAA69D"/><text x="518" y="390" font-size="14" fill="#f3f1eb">Trung gian · #AAA69D</text>
