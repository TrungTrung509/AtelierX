<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ATEL-63 · Sweater Giáng sinh đỏ rượu vang · v2</title>
  <style>
    :root { color-scheme: light; font: 16px/1.6 system-ui, sans-serif; color: #17212a; background: #c5cbd0; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1320px; margin: auto; padding: 24px; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, 0.9fr); gap: 24px; align-items: start; }
    model-viewer { display: block; width: 100%; height: 76vh; min-height: 440px; max-height: 840px; border-radius: 16px; background: radial-gradient(ellipse at 50% 42%, #aab2b9 0%, #858e96 72%, #737d86 100%); --poster-color: #929ba3; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 12px; }
    button { min-height: 42px; padding: 8px 14px; border: 1px solid #56636d; border-radius: 8px; background: #f8f9fa; color: #17212a; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #255f77; outline-offset: 2px; }
    article { padding: 26px; border-radius: 16px; background: #f7f8f9; }
    h1 { margin-top: 0; line-height: 1.2; }
    #product-credits { font-size: 12px; color: #52616e; overflow-wrap: anywhere; }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; padding: 16px; gap: 18px; } model-viewer { height: 62vh; min-height: 360px; max-height: 680px; } article { padding: 20px; } }
  </style>
  <script type="module" src="/atelierx-products/assets/model-viewer.min.js"></script>
</head>
<body>
  <main>
    <section aria-label="Trình xem sweater độc lập">
      <model-viewer id="hoodie" src="./assets/display.glb" alt="Sweater 3D đỏ rượu vang, bo kem và họa tiết cây thông cùng bông tuyết ở ngực trước" camera-controls scale="0.25 0.25 0.25" touch-action="pan-y" interaction-prompt="auto" environment-image="neutral" camera-orbit="0deg 76deg 110%" min-camera-orbit="auto auto 65%" max-camera-orbit="auto auto 240%" shadow-intensity="0.8" shadow-softness="0.8" exposure="1" loading="eager"></model-viewer>
      <p id="loading">Đang tải mẫu…</p><p id="error" hidden>Không tải được mẫu.</p>
      <nav class="controls" aria-label="Góc nhìn sản phẩm">
        <button id="view-front" type="button">Mặt trước</button>
        <button id="view-back" type="button">Mặt sau</button>
        <button id="view-side" type="button">Hông</button>
        <button id="view-oblique" type="button">Chéo</button>
      </nav>
    </section>
    <article id="product-content">
      <h1 id="product-title">Áo sweater Giáng sinh đỏ rượu vang · ATEL-63</h1>
      <p id="product-summary">Đang tải nội dung sản phẩm…</p>
      <div id="product-paragraphs"></div><ul id="product-details"></ul><div id="product-credits"></div>
      <p id="content-error" hidden>Chưa tải được mô tả sản phẩm.</p>
    </article>
  </main>
  <script type="module" src="/atelierx-products/assets/viewer.js"></script>
  <script>
    const v = document.querySelector('#hoodie');
    document.querySelector('#view-side').addEventListener('click', () => { v.cameraOrbit = '90deg 76deg auto'; });
    document.querySelector('#view-oblique').addEventListener('click', () => { v.cameraOrbit = '35deg 76deg auto'; });
  </script>
</body>
</html>
